name: Build MOS VM images

on:
  pull_request:
    paths:
      - "scripts/**"
      - "templates/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "mos-releases tag (blank = latest)"
        required: false
  schedule:
    - cron: "17 6 * * *"   # daily: build only if upstream has a release we haven't published

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils qemu-system-x86 ovmf parted dosfstools unzip jq

      - name: Resolve upstream release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then URL="https://api.github.com/repos/mos-nas/mos-releases/releases/tags/$TAG"
          else URL="https://api.github.com/repos/mos-nas/mos-releases/releases/latest"; fi
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$URL" > rel.json
          TAG=$(jq -r .tag_name rel.json)
          ZIP_URL=$(jq -r '.assets[] | select(.name|test("_amd64\\.zip$")) | .browser_download_url' rel.json)
          DIGEST=$(jq -r '.assets[] | select(.name|test("_amd64\\.zip$")) | .digest' rel.json)
          {
            echo "tag=$TAG"
            echo "zip_url=$ZIP_URL"
            echo "digest=$DIGEST"
          } >> "$GITHUB_OUTPUT"
          if gh release view "vm-$TAG" >/dev/null 2>&1 && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download + verify release ZIP
        if: steps.rel.outputs.skip != 'true'
        run: |
          curl -fsSL -o mos.zip "${{ steps.rel.outputs.zip_url }}"
          want="${{ steps.rel.outputs.digest }}"; want="${want#sha256:}"
          echo "$want  mos.zip" | sha256sum -c -

      - name: Build raw image
        if: steps.rel.outputs.skip != 'true'
        run: ./scripts/build-img.sh mos.zip mos.img 16G

      - name: Smoke test (boot + WebUI)
        if: steps.rel.outputs.skip != 'true'
        env:
          SPEC_OUT: ${{ github.workspace }}/mos-openapi.json
        run: ./scripts/smoke-test.sh mos.img

      - name: Convert + package
        if: steps.rel.outputs.skip != 'true'
        run: |
          NAME="mos-${{ steps.rel.outputs.tag }}-amd64"
          ./scripts/convert.sh mos.img dist "$NAME"
          ./scripts/make-ova.sh "dist/$NAME.vmdk" "dist/$NAME.ova" "${{ steps.rel.outputs.tag }}"
          xz -T0 -k mos.img && mv mos.img.xz "dist/$NAME.img.xz"
          cp mos-openapi.json "dist/mos-openapi-${{ steps.rel.outputs.tag }}.json"
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -lh dist

      - name: Write release notes
        if: steps.rel.outputs.skip != 'true'
        run: |
          cat > release-notes.md <<EOF
          > [!IMPORTANT]
          > **These images are for trying MOS in a virtual machine only.** They are unofficial, built by a third party, and not supported by the MOS project. To run MOS long-term, follow the official instructions: [Create Bootable Media](https://docs.mos-official.net/docs/Installation/Create-Bootable-Media/) and the [MOS docs](https://docs.mos-official.net/).

          Unofficial VM images built from [mos-nas/mos-releases ${{ steps.rel.outputs.tag }}](https://github.com/mos-nas/mos-releases/releases/tag/${{ steps.rel.outputs.tag }}).

          Formats: OVA/VMDK (VMware, VirtualBox), VHDX (Hyper-V), qcow2 (KVM/Proxmox), raw .img.xz. UEFI required; Secure Boot off. Verify downloads with SHA256SUMS.

          Hyper-V needs a **Generation 2** VM with Secure Boot off, and a MOS release whose kernel includes Hyper-V support (0.6.1-stable or newer). The Hyper-V VHDX is untested by this project.
          EOF

      - name: Publish release
        # PRs and non-main manual runs build + test only; they never publish.
        if: steps.rel.outputs.skip != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vm-${{ steps.rel.outputs.tag }}"
          gh release create "$TAG" dist/* --title "MOS ${{ steps.rel.outputs.tag }} VM images" \
            --notes-file release-notes.md \
            || gh release upload "$TAG" dist/* --clobber

      - name: Open or update an issue when the build fails
        if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create build-failure --color B60205 --description "Automated build failed" 2>/dev/null || true
          N=$(gh issue list --label build-failure --state open --json number -q '.[0].number')
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "Build failed again: $RUN_URL"
          else
            gh issue create --title "Scheduled build failed" --label build-failure \
              --assignee "${{ github.repository_owner }}" \
              --body "A build of the MOS VM images failed. Run: $RUN_URL

          This issue closes itself after the next successful publish."
          fi

      - name: Close failure issues after a successful publish
        if: success() && steps.rel.outputs.skip != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label build-failure --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Build succeeded: $RUN_URL"
          done
